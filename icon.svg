<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Calculator Screen Simulation -->
  <rect x="76" y="80" width="360" height="90" rx="20" fill="#0b1120" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <text x="410" y="142" font-family="monospace" font-size="44" font-weight="bold" fill="#6366f1" text-anchor="end">1337</text>

  <!-- Keypad Grid -->
  <!-- Row 1 -->
  <rect x="76" y="195" width="75" height="55" rx="14" fill="#334155" opacity="0.6" />
  <text x="113" y="233" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ef4444" text-anchor="middle">AC</text>

  <rect x="171" y="195" width="75" height="55" rx="14" fill="#334155" opacity="0.6" />
  <text x="208" y="233" font-family="sans-serif" font-size="22" font-weight="bold" fill="#cbd5e1" text-anchor="middle">±</text>

  <rect x="266" y="195" width="75" height="55" rx="14" fill="#334155" opacity="0.6" />
  <text x="303" y="233" font-family="sans-serif" font-size="22" font-weight="bold" fill="#cbd5e1" text-anchor="middle">%</text>

  <rect x="361" y="195" width="75" height="55" rx="14" fill="rgba(99,102,241,0.3)" />
  <text x="398" y="233" font-family="sans-serif" font-size="26" font-weight="bold" fill="#818cf8" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="76" y="265" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="113" y="303" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">7</text>

  <rect x="171" y="265" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="208" y="303" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">8</text>

  <rect x="266" y="265" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="303" y="303" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">9</text>

  <rect x="361" y="265" width="75" height="55" rx="14" fill="rgba(99,102,241,0.3)" />
  <text x="398" y="303" font-family="sans-serif" font-size="26" font-weight="bold" fill="#818cf8" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="76" y="335" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="113" y="373" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">4</text>

  <rect x="171" y="335" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="208" y="373" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">5</text>

  <rect x="266" y="335" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="303" y="373" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">6</text>

  <rect x="361" y="335" width="75" height="55" rx="14" fill="rgba(99,102,241,0.3)" />
  <text x="398" y="373" font-family="sans-serif" font-size="26" font-weight="bold" fill="#818cf8" text-anchor="middle">−</text>

  <!-- Row 4 -->
  <rect x="76" y="405" width="170" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="161" y="443" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">0</text>

  <rect x="266" y="405" width="75" height="55" rx="14" fill="#334155" opacity="0.8" />
  <text x="303" y="443" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">.</text>

  <rect x="361" y="405" width="75" height="55" rx="14" fill="url(#accent)" filter="url(#glow)" />
  <text x="398" y="443" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
</svg>
